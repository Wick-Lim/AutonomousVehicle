[package]
name = "autonomous_vehicle_rust"
version = "1.0.0"
edition = "2021"
description = "Rust native control, safety shield, quintic spline, and timestamp-aware OLS core for AutonomousVehicle"

[lib]
name = "autonomous_vehicle_rust"
crate-type = ["cdylib", "rlib"]

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.20.3" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
